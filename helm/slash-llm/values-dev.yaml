# GPU 노드그룹은 안 만들기로 확정(2026-08-13, 이슈 #12, docs/aws-architecture.md §5-1)
# — Ollama는 EKS 밖 별도 EC2(environments/dev/llm-runtime)에서 돈다. nodeSelector/
# tolerations는 그래서 계속 비워둔다.
image:
  tag: "sha-332ad6db937d87c877e76ddd4d71d3f37c236a34"

replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

env:
  # environments/dev/llm-runtime의 ollama_private_ip 출력값 — 정적 값(§5-1, image.repository와
  # 같은 이유). EC2를 stop/start(터미네이트 아님)로 운용하는 한 안 바뀐다.
  # 2026-08-18: dev 상시운영 전환으로 VPC를 새로 만들면서 IP가 바뀜(10.8.10.169 → 10.8.10.40).
  OLLAMA_URL: "http://10.8.10.40:11434"
