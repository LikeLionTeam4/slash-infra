# GPU 노드그룹은 안 만들기로 확정(2026-08-13, 이슈 #12, docs/aws-architecture.md §5-1)
# — Ollama는 EKS 밖 별도 EC2(environments/dev/llm-runtime)에서 돈다. nodeSelector/
# tolerations는 그래서 계속 비워둔다.
image:
  tag: "sha-96e797b98e342c1eeb19a76a47d223f8f445c639"

replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

env:
  # environments/dev/llm-runtime의 ollama_private_ip 출력값 — 정적 값(§5-1, image.repository와
  # 같은 이유). stop/start(터미네이트 아님)로는 안 바뀐다 — Spot interruption도
  # instance_interruption_behavior=stop이라 마찬가지(schedule.tf). 인스턴스를 실제로
  # 재생성할 때만(AZ 변경 등) 갱신 필요.
  # 2026-08-18: Spot 전환 중 ap-northeast-2a 용량 부족으로 2c로 재생성하며 IP 변경
  # (10.8.10.40 → 10.8.11.201).
  OLLAMA_URL: "http://10.8.11.201:11434"
