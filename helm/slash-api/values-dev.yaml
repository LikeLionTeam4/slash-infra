# dev 환경 구축 진행 중(2026-08-12, network/cognito/database/eks/observability 적용 완료).
image:
  tag: "" # 아직 비워둠 — slash-api에 실제 Dockerfile/CI가 생기면(이슈 #11) 커밋 SHA로 채워짐

serviceAccount:
  roleArn: "" # environments/dev/eks apply 후 output.slash_api_role_arn 값으로 채운다
  # (2026-08-18, modules/eks/slash_api_irsa.tf 신설 — 이슈 #23/#24)

env:
  # RDS/Valkey 엔드포인트 자체는 시크릿이 아니라 평문 env로 충분 — 이슈 #23에서 확보한 실측값.
  DB_URL: "jdbc:postgresql://slash-rds-dev.c3qme6c6e7fj.ap-northeast-2.rds.amazonaws.com:5432/slash_dev"
  VALKEY_HOST: "master.slash-valkey-dev.2iapp0.apn2.cache.amazonaws.com"

externalSecrets:
  enabled: true
  refreshInterval: 1h
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: "rds!db-2d63d5cc-cc90-4ed1-a26e-3d96f4e95097"
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: "rds!db-2d63d5cc-cc90-4ed1-a26e-3d96f4e95097"
        property: password
    # VALKEY_AUTH_TOKEN: 키 이름은 잠정값 — slash-api 앱이 아직 spring.data.redis.password를
    # 안 읽는다(이슈 #23 "문제 1", slash-api 팀 앱 코드 변경 대기). 실제 설정 키가 정해지면
    # 이 secretKey와 아래 envSecrets를 맞춰서 갱신할 것.
    - secretKey: VALKEY_AUTH_TOKEN
      remoteRef:
        key: "slash/valkey/dev"
        property: auth_token

envSecrets:
  - DB_USERNAME
  - DB_PASSWORD
  - VALKEY_AUTH_TOKEN

ingress:
  # 2026-08-12: image.tag가 비어 있는 동안 ingress.enabled=true였더니, pod가 못 뜨는 것과
  # 무관하게 ALB Controller가 실제 ALB를 만들어버렸다(과금 발생, 아무도 명시적으로 켠 적
  # 없는 부수효과). ArgoCD selfHeal 때문에 kubectl로 직접 지워도 다시 살아나므로, git의
  # 이 값을 false로 낮춰서 소스에서부터 막는다 — prune:true라 ArgoCD가 알아서 정리한다.
  # 실제 이미지가 준비되면(이슈 #11) image.tag를 채우는 시점에 같이 true로 되돌릴 것.
  enabled: false
  host: api.dev.sbsh.cloud
  annotations:
    # ACM 인증서는 이미 발급 완료(2026-08-13, 계정 재발급 후 environments/dev/eks/domain.tf
    # 재apply로 새로 발급된 값, ISSUED) — ingress 다시 켤 때 그대로 재사용하면 됨. Route53
    # A레코드 연결은 그 시점에 마저 진행.
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:061039804626:certificate/dae5ed19-5c5d-49e2-9e38-e61df80da39b
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
