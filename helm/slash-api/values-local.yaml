# local은 CI/CD 자동화 대상이 아니다(§11) — 팀원이 직접 `helm install`로 검증할 때만 쓴다.
# dev에서 검증된 실제 이미지를 그대로 재사용한다(이슈 #11, 2026-08-24 mock에서 전환) —
# local 전용 빌드 파이프라인은 없으므로, 필요하면 helm/slash-api/values-dev.yaml의
# 최신 태그로 갱신할 것.
